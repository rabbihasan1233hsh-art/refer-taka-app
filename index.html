<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refer Taka</title>
<style>
body{font-family:sans-serif;background:#f0fdf4;margin:0;padding:15px}
.card{background:#006A4E;color:#fff;padding:25px;border-radius:15px;text-align:center}
.codebox{background:#e8f5e9;border:2px dashed #006A4E;padding:20px;border-radius:15px;text-align:center;margin-top:15px}
.btn{background:#006A4E;color:#fff;border:none;padding:14px;width:100%;border-radius:10px;font-size:17px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h2>Refer Taka</h2>
<h1>৳ 50</h1>
<p>প্রতি রেফারে ২০ টাকা</p>
</div>
<div class="codebox">
<p>আপনার রেফার কোড</p>
<h1 id="mycode">TAKA----</h1>
<button class="btn" onclick="shareCode()">📤 শেয়ার করুন</button>
<p id="msg" style="color:green;font-weight:bold"></p>
</div>
<script>
let code="TAKA-"+Math.floor(1000+Math.random()*9000);
document.getElementById("mycode").innerText=code;
function shareCode(){
let text="আমার Refer Taka কোড: "+code+" লিংক: https://rabbihasan1233hsh-art.github.io/refer-taka-app/";
navigator.clipboard.writeText(text).then(()=>{
document.getElementById("msg").innerText="✅ কপি হয়ে গেছে!";
});
if(navigator.share){navigator.share({text:text});}
}
</script>
</body>
</html>
